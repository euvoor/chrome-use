name: Monaco AMD validation (fork only)
on:
  push:
    branches: [review/monaco-amd-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'euvoor/chrome-use'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.3
          run_install: false
      - name: Prepare virtual display and Chrome sandbox support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The temporary CfT path is not in Ubuntu's packaged Chrome profile.
          # Permit user namespaces in this disposable VM; do not disable Chrome's sandbox.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Download Chrome for Testing from its official release index
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, urllib.parse, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stealth-cft'
          root.mkdir()
          index_url = 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          with urllib.request.urlopen(index_url, timeout=30) as response:
              stable = json.load(response)['channels']['Stable']
          url = next(item['url'] for item in stable['downloads']['chrome'] if item['platform'] == 'linux64')
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname == 'storage.googleapis.com'
          archive = root / 'chrome.zip'
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  assert (root / item.filename).resolve().is_relative_to(root.resolve())
                  bundle.extract(item, root)
                  mode = item.external_attr >> 16
                  if mode:
                      (root / item.filename).chmod(mode)
          chrome = root / 'chrome-linux64/chrome'
          chrome.chmod(0o755)
          evidence = pathlib.Path('stealth-evidence')
          evidence.mkdir()
          (evidence / 'browser-download.json').write_text(json.dumps({'version': stable['version'], 'url': url, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CHROME={chrome}\n')
      - name: Prepare pinned AMD package without install scripts
        working-directory: scripts/amd-validation
        run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: Probe owned fixture with Chrome sandbox enabled
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node scripts/amd-validation/probe.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: monaco-amd-${{ github.sha }}
          path: stealth-evidence
