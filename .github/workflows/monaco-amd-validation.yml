name: Monaco AMD validation (fork only)
on:
  push:
    branches: [review/monaco-amd-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'euvoor/chrome-use'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.3
          run_install: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: cli
          shared-key: linux-ci
          cache-on-failure: true
      - name: Format and test production discovery
        run: |
          mkdir -p stealth-evidence
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          git diff > stealth-evidence/format.patch
          cargo test --locked --profile ci --bin chrome-use --manifest-path cli/Cargo.toml native::monaco_model
          cargo clippy --locked --profile ci --bin chrome-use --manifest-path cli/Cargo.toml -- -D warnings
          node --test scripts/monaco-model.test.js scripts/monaco-clipboard.test.js
      - name: Build baseline discovery and production fix
        run: |
          cp cli/src/native/monaco_model.rs "$RUNNER_TEMP/monaco_model.rs"
          cp cli/src/native/monaco_model.js "$RUNNER_TEMP/monaco_model.js"
          cp cli/src/native/monaco_model_tests.rs "$RUNNER_TEMP/monaco_model_tests.rs"
          for file in monaco_model.rs monaco_model.js monaco_model_tests.rs; do
            git show 7f2d551caea482203eb6d065a40374f40d212cb8:cli/src/native/$file > cli/src/native/$file
          done
          cargo build --locked --profile ci --manifest-path cli/Cargo.toml
          cp cli/target/ci/chrome-use "$RUNNER_TEMP/chrome-use-baseline"
          cp "$RUNNER_TEMP/monaco_model.rs" cli/src/native/monaco_model.rs
          cp "$RUNNER_TEMP/monaco_model.js" cli/src/native/monaco_model.js
          cp "$RUNNER_TEMP/monaco_model_tests.rs" cli/src/native/monaco_model_tests.rs
          cargo build --locked --profile ci --manifest-path cli/Cargo.toml
          sha256sum cli/target/ci/chrome-use "$RUNNER_TEMP/chrome-use-baseline" > stealth-evidence/binaries.sha256
      - name: Prepare virtual display and Chrome sandbox support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The temporary CfT path is not in Ubuntu's packaged Chrome profile.
          # Permit user namespaces in this disposable VM; do not disable Chrome's sandbox.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Download Chrome for Testing from its official release index
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, urllib.parse, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stealth-cft'
          root.mkdir()
          index_url = 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          with urllib.request.urlopen(index_url, timeout=30) as response:
              stable = json.load(response)['channels']['Stable']
          url = next(item['url'] for item in stable['downloads']['chrome'] if item['platform'] == 'linux64')
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname == 'storage.googleapis.com'
          archive = root / 'chrome.zip'
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  assert (root / item.filename).resolve().is_relative_to(root.resolve())
                  bundle.extract(item, root)
                  mode = item.external_attr >> 16
                  if mode:
                      (root / item.filename).chmod(mode)
          chrome = root / 'chrome-linux64/chrome'
          chrome.chmod(0o755)
          evidence = pathlib.Path('stealth-evidence')
          evidence.mkdir(exist_ok=True)
          (evidence / 'browser-download.json').write_text(json.dumps({'version': stable['version'], 'url': url, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CHROME={chrome}\n')
      - name: Prepare pinned AMD package without install scripts
        working-directory: scripts/amd-validation
        run: |
          pnpm install --ignore-scripts --no-frozen-lockfile
          cp pnpm-lock.yaml ../../stealth-evidence/amd-pnpm-lock.yaml
          node build.mjs
      - name: Probe owned fixture with Chrome sandbox enabled
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node scripts/amd-validation/acceptance.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: monaco-amd-${{ github.sha }}
          path: stealth-evidence
