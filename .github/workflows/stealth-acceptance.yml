name: Stealth acceptance (fork validation)

on:
  push:
    branches: [review/stealth-followup-validation]
    paths:
      - '.github/workflows/stealth-acceptance.yml'
      - 'scripts/stealth-acceptance/**'
      - '!scripts/stealth-acceptance/editors/**'
      - '!scripts/stealth-acceptance/editor-checks.mjs'
      - 'cli/**'
  workflow_dispatch:
    inputs:
      model_production:
        description: Exercise production native model access and wrapped-handler clipboard fallback
        type: boolean
        default: false
      extended_geometry:
        description: Test projection with scrolling frames and every capture region in owned active tabs
        type: boolean
        default: false
      geometry_baseline:
        description: Record baseline frame transform refusals
        type: boolean
        default: true
      annotation_only:
        description: Run only the permanent screenshot E2E regression
        type: boolean
        default: false
      monaco_e2e_only:
        description: Run only the permanent Monaco clipboard E2E regression
        type: boolean
        default: false
      editors_only:
        description: Run actual editor package acceptance on disposable profiles
        type: boolean
        default: false
      benchmark_only:
        description: Compare public detectors on audited base and combined source
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  headed:
    if: github.repository == 'euvoor/chrome-use' && !inputs.annotation_only && !inputs.monaco_e2e_only
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.benchmark_only && 45 || 25 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: inputs.editors_only
        with:
          version: 11.1.3
          run_install: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: cli
          shared-key: linux-ci
          cache-on-failure: true
      - name: Test screenshot projection and format
        run: |
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo test --locked --profile ci --bin chrome-use --manifest-path cli/Cargo.toml native::screenshot
          cargo test --locked --profile ci --bin chrome-use --manifest-path cli/Cargo.toml native::relay::tests
          cargo test --locked --profile ci --bin chrome-use --manifest-path cli/Cargo.toml native::monaco_model
          node --test scripts/monaco-model.test.js scripts/monaco-clipboard.test.js
      - name: Build tested CLI
        run: cargo build --locked --profile ci --manifest-path cli/Cargo.toml
      - name: Preserve combined binary for benchmark comparison
        if: inputs.benchmark_only
        run: cp cli/target/ci/chrome-use "$RUNNER_TEMP/chrome-use-combined"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.benchmark_only
        with:
          ref: cb19b6be2c82596c33f58f1376f8b3e485ca230f
          path: stealth-baseline
          persist-credentials: false
      - name: Build audited baseline for benchmark comparison
        if: inputs.benchmark_only
        run: |
          cargo build --locked --profile ci --manifest-path stealth-baseline/cli/Cargo.toml --target-dir cli/target
          cp cli/target/ci/chrome-use "$RUNNER_TEMP/chrome-use-base"
      - name: Prepare virtual display and Chrome sandbox support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The temporary CfT path is not in Ubuntu's packaged Chrome profile.
          # Permit user namespaces in this disposable VM; do not disable Chrome's sandbox.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Download Chrome for Testing from its official release index
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, urllib.parse, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stealth-cft'
          root.mkdir()
          index_url = 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          with urllib.request.urlopen(index_url, timeout=30) as response:
              stable = json.load(response)['channels']['Stable']
          url = next(item['url'] for item in stable['downloads']['chrome'] if item['platform'] == 'linux64')
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname == 'storage.googleapis.com'
          archive = root / 'chrome.zip'
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  assert (root / item.filename).resolve().is_relative_to(root.resolve())
                  bundle.extract(item, root)
                  mode = item.external_attr >> 16
                  if mode:
                      (root / item.filename).chmod(mode)
          chrome = root / 'chrome-linux64/chrome'
          chrome.chmod(0o755)
          evidence = pathlib.Path('stealth-evidence')
          evidence.mkdir()
          (evidence / 'browser-download.json').write_text(json.dumps({'version': stable['version'], 'url': url, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest()}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CHROME={chrome}\n')
      - name: Install and bundle real editor fixtures without dependency install scripts
        if: inputs.editors_only
        working-directory: scripts/stealth-acceptance/editors
        env:
          EDITOR_DIST: ${{ runner.temp }}/stealth-editor-dist
        run: |
          if test -f pnpm-lock.yaml; then
            pnpm install --ignore-scripts --frozen-lockfile
          else
            pnpm install --ignore-scripts --no-frozen-lockfile
          fi
          cp pnpm-lock.yaml ../../../stealth-evidence/editor-pnpm-lock.yaml
          pnpm list --depth Infinity --json > ../../../stealth-evidence/editor-dependencies.json
          node build.mjs
      - name: Run headed launch and real extension relay fixtures
        if: ${{ !inputs.benchmark_only }}
        env:
          STEALTH_PLATFORM: ${{ (!inputs.editors_only && !inputs.benchmark_only) && '1' || '0' }}
          STEALTH_GEOMETRY: '1'
          GEOMETRY_EXTENDED: ${{ inputs.extended_geometry && '1' || '0' }}
          GEOMETRY_BASELINE: '0'
          HOST_BIN: ${{ github.workspace }}/cli/target/ci/chrome-use
          ACCEPT_OUT: ${{ github.workspace }}/stealth-evidence
          STEALTH_EDITORS: ${{ inputs.editors_only && '1' || '0' }}
          STEALTH_MODEL_PRODUCTION: ${{ inputs.model_production && '1' || '0' }}
          EDITOR_DIST: ${{ runner.temp }}/stealth-editor-dist
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node scripts/stealth-acceptance/live.mjs
      - name: Compare existing public benchmark on the same hosted machine
        if: inputs.benchmark_only
        env:
          STEALTH_BENCH: '1'
        run: |
          failed=0
          for revision in base combined; do
            if test "$revision" = base; then
              source_revision=cb19b6be2c82596c33f58f1376f8b3e485ca230f
              extension_path="$GITHUB_WORKSPACE/stealth-baseline/extensions/ab-connect"
            else
              source_revision="$GITHUB_SHA"
              extension_path="$GITHUB_WORKSPACE/extensions/ab-connect"
            fi
            if ! HOST_BIN="$RUNNER_TEMP/chrome-use-$revision" BINARY_SOURCE_REVISION="$source_revision" EXT_DIR="$extension_path" ACCEPT_OUT="$GITHUB_WORKSPACE/stealth-evidence/$revision" xvfb-run -a -s '-screen 0 1440x1000x24' node scripts/stealth-acceptance/live.mjs; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stealth-headed-${{ github.sha }}
          path: stealth-evidence
          if-no-files-found: warn

  windows-custody-control:
    if: false && github.repository == 'euvoor/chrome-use' && github.event_name == 'workflow_dispatch' && !inputs.annotation_only && !inputs.monaco_e2e_only && !inputs.editors_only && !inputs.benchmark_only
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [cb19b6be2c82596c33f58f1376f8b3e485ca230f, combined]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.revision == 'combined' && github.sha || matrix.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: cli
          shared-key: windows-custody-control
      - name: Reproduce process custody timeout on baseline and combined source
        run: cargo test --locked --profile ci --manifest-path cli/Cargo.toml job_contains_descendants_before_the_leader_runs_and_confirms_their_exit -- --nocapture

  annotation-e2e:
    if: github.repository == 'euvoor/chrome-use' && (inputs.annotation_only || inputs.monaco_e2e_only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: cli
          shared-key: linux-ci
      # This existing E2E helper uses headless/no-sandbox, as in full CI.
      # Its isolation boundary is the disposable hosted VM, not Chrome itself.
      - name: Run selected permanent browser regression
        env:
          AGENT_BROWSER_ALLOW_HEADLESS: '1'
          AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
          E2E_FILTER: ${{ inputs.monaco_e2e_only && 'e2e_fill_monaco_is_atomic_and_verified' || 'e2e_screenshot_' }}
        run: cargo test --locked --profile ci --features e2e-tests --manifest-path cli/Cargo.toml "$E2E_FILTER" -- --ignored --test-threads=1
